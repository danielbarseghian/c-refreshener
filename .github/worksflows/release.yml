name: Build and Release

on:
  push:
    tags:
      - "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux
            cc: gcc
            make_target: all
          - os: macos-latest
            artifact_name: macos
            cc: clang
            make_target: all
          - os: windows-latest
            artifact_name: windows
            cc: gcc
            make_target: all
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y make gcc

      - name: Install build tools
        if: runner.os == 'macOS'
        run: xcode-select --install || true

      - name: Install build tools
        if: runner.os == 'Windows'
        run: pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make

      - name: Build counter
        working-directory: counter
        run: make CC=${{ matrix.cc }}

      - name: Build mini-grep
        working-directory: mini-grep
        run: make CC=${{ matrix.cc }}

      - name: Package binaries
        run: |
          mkdir -p dist
          cp counter/*counter* dist/ 2>/dev/null || true
          cp mini-grep/*grep* dist/ 2>/dev/null || true
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Get-ChildItem counter -Recurse -Include *.exe | Copy-Item -Destination dist -Force"
            powershell -Command "Get-ChildItem mini-grep -Recurse -Include *.exe | Copy-Item -Destination dist -Force"
          fi
          tar -czf artifacts-${{ matrix.artifact_name }}.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts-${{ matrix.artifact_name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*

