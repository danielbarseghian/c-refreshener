name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows

    steps:
      - uses: actions/checkout@v4

      - name: Build programs
        shell: bash
        run: |
          set -euxo pipefail
          make -C mini-grep
          make -C counter

      - name: Package binaries
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist/${{ matrix.artifact }}

          # Adjust these paths if either Makefile writes its binary elsewhere.
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp mini-grep/minigrep.exe dist/${{ matrix.artifact }}/
            cp counter/counter.exe dist/${{ matrix.artifact }}/
          else
            cp mini-grep/minigrep dist/${{ matrix.artifact }}/
            cp counter/counter dist/${{ matrix.artifact }}/
          fi

          cd dist
          7z a "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true

